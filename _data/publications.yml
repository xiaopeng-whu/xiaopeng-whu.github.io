- id: crosser
  title: "CROSSER: Learning Generalizable Humanoid Locomotion Through Inverse Dynamics-Guided Cross-Simulator Adaptation"
  url: "https://ieeexplore.ieee.org/abstract/document/11231381"
  authors: "**Zepeng Wang<sup>\\*</sup>**, Xiaochuan Shi<sup>\\*</sup>, Ziluo Ding, Yuxuan Wang, Zhenguo Sun, Chao Ma<sup>†</sup>, Zongqing Lu<sup>†</sup>"
  year: 2025
  venue: "RA-L"
  label: "CROSSER"
  tldr: "Different simulators can disagree on which action produces the same step. CROSSER uses inverse dynamics to identify those disagreements and train walking policies that transfer more reliably between simulators."
  topic: "Cross-simulator adaptation"
  image: "/images/publications/crosser.png"
  image_width: 1443
  image_height: 741
  image_alt: "CROSSER Figure 2: overall framework with the latent inverse dynamics model and cross-simulator policy learning."
  image_source: "https://doi.org/10.1109/LRA.2025.3630544"
- id: rlpf
  title: "RL from Physical Feedback: Aligning Large Motion Models with Humanoid Control"
  url: "https://arxiv.org/abs/2506.12769"
  webpage: "https://beingbeyond.github.io/RLPF/"
  authors: "Junpeng Yue, **Zepeng Wang**, Yuxuan Wang, Weishuai Zeng, Jiangxing Wang, Xinrun Xu, Yu Zhang, Sipeng Zheng, Ziluo Ding, Zongqing Lu<sup>†</sup>"
  year: 2026
  venue: "ECCV"
  label: "RLPF"
  tldr: "A motion can match a text prompt yet be impossible for a robot to perform. RLPF rewards motions a simulated humanoid can track while checking that they still match the prompt, improving execution on a real robot."
  topic: "Learning from physical feedback"
  image: "/images/publications/rlpf.png"
  image_width: 2021
  image_height: 1204
  image_alt: "Comparison of text-to-motion models and RLPF in simulation and on a real robot, from Figure 1."
  image_source: "https://arxiv.org/html/2506.12769v1"
- id: being-m07
  title: "Being-M0.7: A Latent World-Action Model for Humanoid Robots"
  url: "https://research.beingbeyond.com/being-m07/being-m07.pdf"
  webpage: "https://research.beingbeyond.com/being-m07/"
  authors: "Junpeng Yue<sup>\\*</sup>, Boyuan Li<sup>\\*</sup>, Yuxuan Wang<sup>\\*</sup>, **Zepeng Wang**, Yuhui Fu, Feiyang Xie, Yu Zhang, Jing Zhang, Jiangxing Wang, Zongqing Lu<sup>‡</sup>"
  year: 2026
  venue: "arXiv"
  label: "Being-M0.7"
  tldr: "Being-M0.7 learns from human videos and motion sequences to predict both what comes into view and how the body moves. An action expert uses those predictions to guide a humanoid as it moves and manipulates objects."
