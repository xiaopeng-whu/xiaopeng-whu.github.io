- id: redirectmimic
  title: "RedirectMimic: Local Motion Content Redaction for Humanoid Whole-Body Control"
  url: "https://arxiv.org/pdf/2611.14049"
  webpage: "https://xiaopeng-whu.github.io/RedirectMimic/"
  authors: "**Zepeng Wang**, Xiaochuan Shi<sup>†</sup>"
  year: 2026
  venue: "arXiv"
  label: "RedirectMimic"
  tldr: "A humanoid can keep following a reference motion while replacing just one gesture. In simulation, training on an edited target let it lower an overhead arm while retaining the rest of the movement, even when it still saw the original reference."
  topic: "Local motion content redaction"
  image: "/images/publications/redirectmimic-teaser.png"
