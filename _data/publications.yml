- id: cora
  title: "Command-Referenced Observation Attacks for Behavior Hijacking in Humanoid Locomotion"
  webpage: "https://xiaopeng-whu.github.io/CoRA/"
  authors: "**Zepeng Wang<sup>\\*</sup>**, Ziluo Ding<sup>\\*</sup>, Fengyi Zhang, Kan Yuan, Xiaochuan Shi<sup>†</sup>"
  year: 2026
  venue: "Under review"
  label: "CoRA"
  tldr: "Staying upright does not mean a robot is following its command. In simulation, small changes to sensor observations made a humanoid turn or drift sideways while it continued to receive the same forward command."
  topic: "Observation attacks for humanoid locomotion"
  image: "/images/publications/cora-teaser.png"
  image_width: 919
  image_height: 307
  image_alt: "CoRA teaser: command-following locomotion, bounded observation attacks, and targeted behavior hijacking."
  image_source: "CoRA-IoTJ-2026/figures/teaser/CoRA_teaser_figure.pdf"
- id: ccpo
  title: "CCPO: Conservatively constrained policy optimization using state augmentation"
  url: "https://ebooks.iospress.nl/doi/10.3233/FAIA230566"
  code: "https://github.com/xiaopeng-whu/CCPO"
  authors: "**Zepeng Wang<sup>\\*</sup>**, Xiaochuan Shi<sup>\\*</sup>, Chao Ma<sup>†</sup>, Libing Wu, Jia Wu"
  year: 2023
  venue: "ECAI"
  label: "CCPO"
  tldr: "CCPO gives a reinforcement learning policy its remaining safety budget and makes violations more costly as that budget shrinks. On control benchmarks, it reduced constraint costs while earning rewards comparable to competing methods."
  topic: "Constrained policy optimization"
