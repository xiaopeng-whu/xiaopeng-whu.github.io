# Order within each year follows this file. Omit image to use a text cover.
- id: fast
  title: "General Humanoid Whole-Body Control via Pretraining and Fast Adaptation"
  url: "https://arxiv.org/abs/2602.11929"
  webpage: "https://beingbeyond.github.io/FAST/"
  authors: "**Zepeng Wang**, Jiangxing Wang, Shiqing Yao, Yu Zhang, Ziluo Ding, Ming Yang, Yuxuan Wang, Haobin Jiang, Chao Ma, Xiaochuan Shi<sup>†</sup>, Zongqing Lu<sup>‡</sup>"
  year: 2026
  venue: "CoRL"
  label: "FAST"
  tldr: "A humanoid controller pretrained on diverse motions can balance through side kicks and single-leg squats. A small residual policy helps it learn unfamiliar movements while retaining skills it already tracks well."
  topic: "Whole-body control"
  image: "/images/publications/fast-figure1.png"
  image_width: 957
  image_height: 957
  image_alt: "FAST Figure 1 (CoRL version): zero-shot teleoperation and fast-adaptation skills."
