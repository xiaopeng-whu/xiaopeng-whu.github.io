- id: plat
  title: "PLAT: Sparse Timed Keyframe Motion Tracking for Humanoid Control via Privileged Latent Transition Learning"
  url: "https://arxiv.org/abs/2609.25754"
  authors: "**Zepeng Wang**, Jiangxing Wang, Chao Ma, Xiaochuan Shi<sup>†</sup>, Zongqing Lu<sup>‡</sup>"
  year: 2026
  venue: "arXiv"
  label: "PLAT"
  tldr: "Give a humanoid a few target poses and the times it should reach them. PLAT learns the transitions from dense motion examples during training, then follows sparse keyframes on a real robot."
  topic: "Sparse keyframe tracking"
  image: "/images/publications/plat.png"
